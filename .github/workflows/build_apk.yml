name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create and Build App
        run: |
          # 1. إنشاء مشروع نظيف
          rm -rf my_app
          flutter create --org com.voip --project-name my_app my_app
          cd my_app

          # 2. إضافة الحزم المطلوبة
          flutter pub add flutter_webrtc web_socket_channel permission_handler

          # 3. نسخ كود التطبيق
          cp "$GITHUB_WORKSPACE/lib/main.dart" lib/main.dart

          # 4. ضبط minSdk إلى 21 لدعم WebRTC
          grep -rl "minSdk" android/ | xargs sed -i 's/minSdk = .*/minSdk = 21/g' 2>/dev/null || true
          grep -rl "minSdkVersion" android/ | xargs sed -i 's/minSdkVersion .*/minSdkVersion 21/g' 2>/dev/null || true

          # 5. إضافة أذونات الصوت والشبكة
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n<uses-permission android:name="android.permission.CAMERA"/>' android/app/src/main/AndroidManifest.xml

          # 6. بناء ملف APK للتثبيت المباشر
          flutter build apk --debug

          # 7. نقل الملف الجاهز للتحميل
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/output/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: output/app-debug.apk
          
