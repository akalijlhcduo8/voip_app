name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        run: |
          # 1. إنشاء المشروع وتهيئته
          flutter create . --platforms=android --project-name my_voip_app
          
          # 2. إضافة المكتبات
          flutter pub add flutter_webrtc web_socket_channel permission_handler
          
          # 3. نسخ كود الشاشة
          cp "$GITHUB_WORKSPACE/lib/main.dart" lib/main.dart
          
          # 4. بناء الـ APK مباشرة (دع Flutter يهتم بالإعدادات التلقائية)
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          
